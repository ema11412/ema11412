name: Generate snake and daily card

on:
  schedule: # 00:05 y 12:05 de Costa Rica (UTC−6): la carta cambia a medianoche
    - cron: "5 6,18 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # Colores del perfil: dorado para la serpiente, morados para las contribuciones
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#c58a22&color_dots=#efe9f7,#d6c2f5,#a77bea,#7b2fd6,#4a1a8f
            dist/snake-dark.svg?palette=github-dark&color_snake=#f2c45a&color_dots=#1c1430,#3b1d6e,#6a2fb8,#b46bff,#f2c45a

      # Marco con estrellas, cometa y estadísticas del último año
      - name: frame snake.svg
        run: node .github/scripts/snake-frame.mjs ${{ github.repository_owner }} dist/snake.svg dist/snake-dark.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Carta del día de Space Pirates
      - name: carta del día
        run: node .github/scripts/carta-del-dia.mjs dist/carta-del-dia.svg

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
